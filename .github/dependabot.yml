version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: gradle
    directory: /platform/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      android:
        patterns:
          - "*"
  - package-ecosystem: nuget
    directory: /platform/dotnet
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dotnet:
        patterns:
          - "*"
  - package-ecosystem: swift
    directory: /platform/apple
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
