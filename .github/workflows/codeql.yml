name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev libgl-dev libegl-dev libx11-dev libxi-dev libxcursor-dev
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          upload: failure-only
          output: sarif
      - name: Collect results
        run: f=$(ls sarif/*.sarif | head -1) && mv "$f" sarif/results.sarif
      - uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0
        with:
          patterns: |
            -build/**
            -**/CMakeFiles/**
            -src/render/shaders/map.glsl.h
            -third_party/**
            -test/**:cpp/unused-static-function
          input: sarif/results.sarif
          output: sarif/results.sarif
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif/results.sarif
          category: /language:${{ matrix.language }}
