name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
          - name: Linux
            os: ubuntu-24.04
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: macOS
            os: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev libgl-dev libegl-dev libx11-dev libxi-dev libxcursor-dev xvfb mesa-utils
      - name: Install Ninja
        if: runner.os != 'Linux'
        run: pip install ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Test
        working-directory: test
        run: ../build/test/mapkern_unit

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Install CMake 4.4
        run: pip install cmake==4.4.4 ninja && cmake --version
      - name: Build AAR and demo APK
        working-directory: platform/android
        run: ./gradlew --no-daemon :mapkern:assembleRelease :demo:assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: |
            platform/android/mapkern/build/outputs/aar/*.aar
            platform/android/demo/build/outputs/apk/release/*.apk

  dotnet:
    name: .NET
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Install Ninja
        run: pip install ninja
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build native library
        run: |
          cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMAPKERN_TESTS=OFF -DMAPKERN_VIEWER=OFF
          cmake --build build/windows --target mapkern_c
      - name: Build SDK and demo
        run: dotnet build platform/dotnet/Mapkern.slnx -c Release
      - name: Pack
        run: |
          dotnet pack platform/dotnet/Mapkern/Mapkern.csproj -c Release -o out/nuget
          dotnet pack platform/dotnet/Mapkern.WinForms/Mapkern.WinForms.csproj -c Release -o out/nuget
      - uses: actions/upload-artifact@v5
        with:
          name: dotnet
          path: out/nuget/*.nupkg

  apple:
    name: Apple SDK
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: brew install ninja
      - name: Build XCFramework
        run: sh platform/apple/build-xcframework.sh
      - name: Build Swift package for macOS
        working-directory: platform/apple
        run: swift build -c release
      - name: Build Swift package for iOS
        working-directory: platform/apple
        run: xcodebuild -scheme Mapkern -destination 'generic/platform=iOS' -quiet build
      - name: Archive XCFramework
        run: cd platform/apple && zip -qry Mapkern.xcframework.zip Mapkern.xcframework
      - uses: actions/upload-artifact@v5
        with:
          name: apple
          path: platform/apple/Mapkern.xcframework.zip
