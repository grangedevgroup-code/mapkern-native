name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            package: windows-x64
          - name: Linux
            os: ubuntu-24.04
            package: linux-x64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            package: linux-arm64
          - name: macOS
            os: macos-15
            package: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev libgl-dev libegl-dev libx11-dev libxi-dev libxcursor-dev xvfb mesa-utils
      - name: Install Ninja
        if: runner.os != 'Linux'
        run: pip install ninja
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Test
        working-directory: test
        run: ../build/test/mapkern_unit
      - name: Build the hello example
        run: |
          cmake -S examples/hello -B build-hello -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFETCHCONTENT_SOURCE_DIR_MAPKERN=${{ github.workspace }}
          cmake --build build-hello
      - name: Package
        run: |
          cmake --install build --prefix ${{ runner.temp }}/${{ matrix.package }}/mapkern-native --strip
          cmake -E chdir ${{ runner.temp }}/${{ matrix.package }} cmake -E tar cf ${{ github.workspace }}/${{ matrix.package }}.zip --format=zip mapkern-native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.package }}
          path: ${{ matrix.package }}.zip

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install CMake 4.4
        run: pip install cmake==4.4.4 ninja && cmake --version
      - name: Build AAR and demo APK
        working-directory: platform/android
        run: ./gradlew --no-daemon :mapkern:assembleRelease :demo:assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: |
            platform/android/mapkern/build/outputs/aar/*.aar
            platform/android/demo/build/outputs/apk/release/*.apk

  dotnet:
    name: .NET
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Install Ninja
        run: pip install ninja
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Build native library
        run: |
          cmake -S . -B build/windows -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DMAPKERN_TESTS=OFF -DMAPKERN_VIEWER=OFF
          cmake --build build/windows --target mapkern_c
      - name: Build SDK and demo
        run: dotnet build platform/dotnet/Demo/Demo.csproj -c Release -p:Platform=AnyCPU
      - name: Pack
        run: |
          dotnet pack platform/dotnet/Mapkern/Mapkern.csproj -c Release -p:Platform=AnyCPU -o out/nuget
          dotnet pack platform/dotnet/Mapkern.WinForms/Mapkern.WinForms.csproj -c Release -p:Platform=AnyCPU -o out/nuget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet
          path: out/nuget/*.nupkg

  apple:
    name: Apple SDK
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ninja
        run: brew install ninja
      - name: Build XCFramework
        run: sh platform/apple/build-xcframework.sh
      - name: Build Swift package for macOS
        working-directory: platform/apple
        run: swift build -c release
      - name: Build Swift package for iOS
        working-directory: platform/apple
        run: xcodebuild -scheme Mapkern -destination 'generic/platform=iOS' -quiet build
      - name: Archive XCFramework
        run: cd platform/apple && zip -qry Mapkern.xcframework.zip Mapkern.xcframework
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple
          path: platform/apple/Mapkern.xcframework.zip
